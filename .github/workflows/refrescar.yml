name: Refrescar tablero

on:
  # Dos cron desfasados (:17 en horas pares UTC y :47 en impares) = una corrida cada hora, 24 por día.
  # GitHub pierde corridas programadas, así que cada slot tiene respaldo. GitHub descarta o retrasa horas los cron en punto (:00) cuando va cargado:
  # con 6 al día en minuto 0 se perdían la mitad y el tablero quedaba 9-19 h viejo. Más corridas = tolerar pérdidas.
  # GitHub Pages no consume créditos (Netlify sí: 15 por deploy).
  # GitHub desactiva los horarios de un repo público tras 60 días sin actividad: si pasa, reactivar en la pestaña Actions.
  schedule:
    - cron: '17 */2 * * *'
    - cron: '47 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refrescar-tablero
  cancel-in-progress: false

jobs:
  # Dos jobs a propósito: si la subida y el deploy van en el mismo job, deploy-pages a veces no ve el artefacto
  # recién subido (actions/deploy-pages#451). Separados, la búsqueda ocurre segundos después y no falla.
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Actualizar noticias y mercados
        run: python actualizar.py --ia-nube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Preparar HTML cifrado
        run: python preparar_publico.py
        env:
          TABLERO_CLAVE: ${{ secrets.TABLERO_CLAVE }}
      - name: Verificar carpeta de publicación
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          esperado = sorted(['index.html', 'manifest.webmanifest', 'sw.js', 'icon-192.png', 'icon-512.png', 'icon-maskable-512.png'])
          assert sorted(p.relative_to(dist).as_posix() for p in dist.rglob('*')) == esperado, 'dist debe contener solo index.html y los archivos de la app'
          assert 'staticrypt' in (dist / 'index.html').read_text(encoding='utf-8'), 'Falta cifrado StatiCrypt'
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

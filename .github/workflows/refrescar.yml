name: Refrescar tablero

on:
  # PAUSADO hasta comprobar que GitHub Pages funciona (Netlify se abandonó: 15 créditos por deploy, 300 al mes).
  # Descomentar schedule para reactivar el refresco automático.
  # schedule:
  #   - cron: '0 11,14,17,20,23,2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refrescar-tablero
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Actualizar noticias y mercados
        run: python actualizar.py --ia-nube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Preparar HTML cifrado
        run: python preparar_publico.py
        env:
          TABLERO_CLAVE: ${{ secrets.TABLERO_CLAVE }}
      - name: Verificar carpeta de publicación
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          assert sorted(p.relative_to(dist).as_posix() for p in dist.rglob('*')) == ['index.html'], 'dist debe contener solo index.html'
          assert 'staticrypt' in (dist / 'index.html').read_text(encoding='utf-8'), 'Falta cifrado StatiCrypt'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
